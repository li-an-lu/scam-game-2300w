<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2300萬分之1 · 可執行預覽</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c12;--card:#141820;--fg:#e8e4e0;--mut:#a89a94;--acc:#d4a574;--warn:#c45c5c;--gold:#c9a87a;--soft:rgba(196,92,92,.12);--line:rgba(212,165,116,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC",sans-serif;font-size:16px;line-height:1.65;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:32px 16px 48px}
.meta{font-size:12px;color:var(--mut);letter-spacing:.08em;margin-bottom:16px}
h1{font-family:"Noto Serif TC",serif;font-size:48px;font-weight:700;margin:0 0 8px;letter-spacing:-.03em}
h1 .one{color:var(--warn);text-shadow:0 0 18px rgba(196,92,92,.3)}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{text-align:center;background:rgba(255,255,255,.03);border-radius:8px;padding:8px 4px}
.stat span{display:block;font-size:11px;color:var(--mut)}
.stat b{color:var(--gold)}
button{font-family:inherit;cursor:pointer;border-radius:10px;padding:12px;font-size:15px;width:100%}
button.primary{background:linear-gradient(180deg,#c45c5c,#a84848);color:#fff;border:none;font-weight:700}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);margin-top:8px}
.choice{background:#1c2028;border:1px solid var(--line);margin:8px 0;padding:10px 12px;border-radius:10px;text-align:left}
.choice:hover{border-color:var(--warn)}
.narr{color:#d8d0c8;font-size:15.5px}
.flag{display:inline-block;font-size:11px;color:var(--warn);background:var(--soft);padding:2px 6px;border-radius:4px;margin-left:6px}
.footer{text-align:center;color:var(--mut);font-style:italic;margin-top:16px}
.log{font-size:13px;color:var(--mut);max-height:180px;overflow:auto;margin-top:12px}
.end-card{border-left:3px solid var(--warn);padding-left:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');

// Core flags from design-adjustments-final.md
const CORE_FLAGS = {
  heard_stranger: '不要隨便跟陌生人說話',
  heard_police: '不去的話警察會來抓你',
  heard_everyone: '別人都在補／別人都在做',
  said_its_fine: '跟家人說「還好」',
  heard_miss_chance: '現在不試以後就沒機會',
  obey_authority: '不要搞複雜／照做就好'
};

// Passive lies (sample from provided content)
const LIES = [
  {age:5, stage:'童年', text:'媽媽說：「吃不完，以後娶的老婆臉上會有痘痘喔。」', flag:null},
  {age:6, stage:'童年', text:'爸爸說：「不去的話，警察會來把你抓去關。」', flag:'heard_police'},
  {age:7, stage:'童年', text:'媽媽說：「天黑了還在外面，虎姑婆會來把你帶走。」', flag:'heard_stranger'},
  {age:14, stage:'學生', text:'媽媽說：「再這樣下去，以後連私立都讀不上。」', flag:null},
  {age:15, stage:'學生', text:'爸爸說：「別人都在補，你不補以後就跟不上。」', flag:'heard_everyone'},
  {age:24, stage:'出社會', text:'主管說：「公司像家，大家一起拼，以後升遷才有機會。」', flag:null},
  {age:28, stage:'出社會', text:'你跟家人說工作「還好」，沒有提被當眾糾正的事。', flag:'said_its_fine'},
  {age:33, stage:'出社會', text:'同事說：「現在不進場以後就沒機會了。」', flag:'heard_miss_chance'}
];

// Positive events (sample)
const POS = [
  {id:'p_remind_family', age:30, text:'朋友傳訊息：「先打給家人確認一下。」', choices:[
    {t:'先打給家人', effects:{心:1,警:2}, flag:'reminded_family', result:'你打了。對方說先不要。你把頁面關掉。'},
    {t:'說再看看', effects:{心:0}, result:'訊息留著，你沒有立刻打。'}
  ]},
  {id:'a_colleague_help', age:24, text:'同事主動說：「我之前做過類似的，可以跟你說。」', choices:[
    {t:'聽他講', effects:{心:2,人:2}, result:'他講完關鍵點後就回去工作。'},
    {t:'說自己再看看', effects:{心:1}, result:'他點點頭，沒有再過來。'}
  ]}
];

// Endings with weights (from design-adjustments-final)
const ENDINGS = [
  {id:'END_TRUST_LONG', name:'他每天跟我說早安', base:8, boost:{heard_stranger:18}, text:'你記得小時候大人說過，不要隨便跟陌生人說話。但這個人已經跟你聊天三個月了。', card:'假交友結合投資。建立信任→引入投資→誘導加碼→出金受阻。'},
  {id:'END_AUTHORITY_CALL', name:'他說他是警察', base:6, boost:{heard_police:16}, text:'你小時候聽過「不去的話警察會來抓你」。這通電話裡，對方語氣很確定。', card:'假檢警。真正警察不會電話要求操作 ATM。'},
  {id:'END_GROUP_PROFIT', name:'群組裡每個人都在賺', base:10, boost:{heard_everyone:20, heard_miss_chance:20}, text:'你記得學生時期常聽到「別人都在補，你不補就跟不上」。這次群組裡每個人都在曬獲利。', card:'假投資群組曬單。初期可出金，後續要求保證金後失聯。'},
  {id:'END_DONT_WORRY', name:'不想讓家人擔心', base:8, boost:{said_its_fine:18}, text:'你出社會後習慣跟家人說「還好」。這次你也沒有講。', card:'被害人選擇不告知家人，損失擴大。'},
  {id:'END_INVEST_SMALL', name:'先小額試試', base:10, boost:{heard_miss_chance:18}, text:'對方說先放一點點就好。你覺得金額不大，就轉了。', card:'小額可出金建立信任，再誘導加碼。'},
  {id:'END_SHOPPING_LINK', name:'客服說要驗證', base:12, boost:{obey_authority:16}, text:'對方說要先驗證身分才能出貨。你不想把事情搞複雜，就照做了。', card:'網購詐騙。跳過正規平台、出現「驗證」即高風險。'},
  {id:'END_ALMOST', name:'差點匯出去', base:6, boost:{reminded_family:22}, light:true, text:'你已經打開網銀了。後來你打給家人，對方說「先不要」。', card:'部分案件在最後一步被成功勸阻。'},
  {id:'END_QUIET', name:'這一生沒什麼大事', base:15, boost:{}, light:true, text:'你沒有遇過什麼大詐騙。薪水不多，但每個月都過得去。', card:'多數日常謊言是小謊，重大損失集中在少數類型。'},
  {id:'END_HELPED_OTHERS', name:'你勸過別人', base:4, boost:{reminded_family:12}, light:true, text:'有朋友差點匯款，你叫他先打給家人確認。他後來沒有轉。', card:'親友勸阻是實務上有效的防止損失方式。'}
];

let state = {age:4, stats:{存款:0,警覺:3,人際:3,心理:5}, flags:new Set(), log:[]};

function renderStart(){
  app.innerHTML = `
    <div class="meta">台灣人生模擬 · 取材自真實資料 · 最終版預覽</div>
    <h1>2300萬<span style="font-size:.5em;color:var(--mut)">分之</span><span class="one">1</span></h1>
    <p class="sub">你是其中一個。<br>大多數謊言很小，但有些會變成轉機。</p>
    <div class="card">
      <div class="stats">
        <div class="stat"><span>存款</span><b>隨機</b></div>
        <div class="stat"><span>警覺</span><b>隨機</b></div>
        <div class="stat"><span>人際</span><b>隨機</b></div>
        <div class="stat"><span>心理</span><b>隨機</b></div>
      </div>
      <button class="primary" onclick="startLife()">開始這一生 →</button>
    </div>
    <p class="footer">上當的人不笨，往往只是太真誠。</p>
  `;
}

function startLife(){
  state.stats.存款 = Math.floor(Math.random()*50000)+10000;
  state.stats.警覺 = Math.floor(Math.random()*6)+2;
  state.stats.人際 = Math.floor(Math.random()*6)+2;
  state.stats.心理 = Math.floor(Math.random()*6)+3;
  nextBeat();
}

function nextBeat(){
  if(state.age > 40){ return showEnding(); }
  // Passive lie chance
  const lie = LIES.find(l => l.age === state.age && Math.random() < 0.6);
  if(lie){
    if(lie.flag) state.flags.add(lie.flag);
    state.log.push(`【${lie.age}歲 被動謊言】${lie.text}`);
    app.innerHTML = hud() + `<div class="card narr">${lie.text}<br><small style="color:var(--mut)">（心 -1）${lie.flag?' <span class="flag">'+lie.flag+'</span>':''}</small></div>
      <button class="primary" onclick="advance()">繼續</button>` + logHtml();
    state.stats.心理 = Math.max(0, state.stats.心理-1);
    return;
  }
  // Positive event chance
  const pos = POS.find(p => p.age === state.age && Math.random() < 0.5);
  if(pos){
    app.innerHTML = hud() + `<div class="card"><div class="narr">${pos.text}</div>
      ${pos.choices.map((c,i)=>`<div class="choice" onclick="pickPos(${i},${JSON.stringify(pos.id).replace(/"/g,"'")})">${c.t}</div>`).join('')}
    </div>` + logHtml();
    window._curPos = pos;
    return;
  }
  // Skip year
  state.age++;
  nextBeat();
}

function advance(){ state.age++; nextBeat(); }

function pickPos(i){
  const c = window._curPos.choices[i];
  for(const [k,v] of Object.entries(c.effects||{})){
    if(k==='心') state.stats.心理 += v;
    if(k==='警') state.stats.警覺 += v;
    if(k==='人') state.stats.人際 += v;
  }
  if(c.flag) state.flags.add(c.flag);
  state.log.push(`【${state.age}歲】${window._curPos.text} → ${c.t}：${c.result}`);
  app.innerHTML = hud() + `<div class="card narr">${c.result}</div><button class="primary" onclick="advance()">繼續</button>` + logHtml();
}

function hud(){
  return `<div class="meta">${state.age} 歲　存款 ${state.stats.存款.toLocaleString()}　警覺 ${state.stats.警覺}　人際 ${state.stats.人際}　心理 ${state.stats.心理}</div>`;
}
function logHtml(){
  return `<div class="log">${state.log.slice(-6).map(l=>`<div>${l}</div>`).join('')}</div>`;
}

function showEnding(){
  // Weighted pick based on flags
  const pool = ENDINGS.map(e=>{
    let w = e.base;
    for(const [f,nw] of Object.entries(e.boost||{})) if(state.flags.has(f)) w = Math.max(w, nw);
    if(e.id==='END_QUIET' && state.flags.size===0) w = 25;
    return {e, w};
  });
  const light = pool.filter(x=>x.e.light);
  const heavy = pool.filter(x=>!x.e.light);
  const use = (state.flags.has('reminded_family') && Math.random()<0.6) ? light : (Math.random()<0.35 ? light : heavy);
  const total = use.reduce((s,x)=>s+x.w,0);
  let r = Math.random()*total;
  let chosen = use[0].e;
  for(const x of use){ if((r-=x.w)<=0){ chosen=x.e; break; } }

  app.innerHTML = `
    <div class="meta">結局</div>
    <h1 style="font-size:32px">${chosen.name}</h1>
    <div class="card end-card">
      <div class="narr">${chosen.text}</div>
      <p style="margin-top:12px"><strong>真實案件卡：</strong><br>${chosen.card}</p>
      <p><strong>你這一生聽過的話：</strong><br>${[...state.flags].map(f=>CORE_FLAGS[f]||f).join('、')||'（沒有特別留下）'}</p>
    </div>
    <button class="primary" onclick="location.reload()">再活一次</button>
    <div class="log">${state.log.map(l=>`<div>${l}</div>`).join('')}</div>
  `;
}

renderStart();
</script>
</body>
</html>
