<style>
:root{--bg:#0a0c12;--card:#141820;--fg:#e8e4e0;--mut:#a89a94;--acc:#d4a574;--warn:#c45c5c;--gold:#c9a87a;--line:rgba(212,165,116,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC",sans-serif;font-size:16px;line-height:1.65;min-height:100vh}
.wrap{max-width:580px;margin:0 auto;padding:28px 16px 60px}

.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}

.stat span{display:block;font-size:11px;color:var(--mut)}

button{font-family:inherit;cursor:pointer;border-radius:10px;padding:12px;font-size:15px;width:100%;border:none}
button.primary{background:linear-gradient(180deg,#c45c5c,#a84848);color:#fff;font-weight:700}

.choice{background:#1c2028;border:1px solid var(--line);margin:8px 0;padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer}
.choice:hover{border-color:var(--warn)}
.narr{font-size:15.5px;color:#e0d8d0}
.flag{display:inline-block;font-size:11px;color:var(--warn);background:rgba(196,92,92,.12);padding:1px 6px;border-radius:4px;margin-left:4px}
.footer{text-align:center;color:var(--mut);font-style:italic;margin-top:14px}
.log{font-size:12.5px;color:var(--mut);max-height:200px;overflow:auto;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.end{border-left:3px solid var(--warn);padding-left:10px}

<script>
const CONTENT = {"lies": [{"age": 5, "text": "你把碗裡最後幾口飯推到一邊。媽媽看了一眼，語氣平靜地說：「吃不完，以後娶的老婆臉上會有痘痘喔。」", "flag": null}, {"age": 6, "text": "你說今天肚子不舒服，想請假。爸爸蹲下來，聲音很輕：「不去的話，警察會來把你抓去關。」", "flag": "heard_police"}, {"age": 7, "text": "你想去巷口找同學玩。媽媽站在門口說：「天黑了還在外面，虎姑婆會來把你帶走。」", "flag": null}, {"age": 8, "text": "你跌倒把膝蓋擦破，眼淚掉下來。旁邊的大人說：「男生不可以哭，哭的人以後沒出息。」", "flag": null}, {"age": 9, "text": "你想買一本漫畫。爸爸說：「錢是辛苦賺來的，小孩子不應該亂花。現在存起來，以後才會有錢。」", "flag": null}, {"age": 10, "text": "你說今天不想寫作業。媽媽看著你：「不寫的話，以後只能去撿垃圾。」", "flag": null}, {"age": 11, "text": "親戚來家裡，看著你說：「你看隔壁那個誰，成績多好。你要是再不用功，以後就沒人要。」", "flag": null}, {"age": 4, "text": "你不肯吃藥。媽媽把湯匙靠近你的嘴：「不吃的話，病不會好，會一直痛。」", "flag": null}, {"age": 6, "text": "你看完卡通還想再看一集。爸爸把遙控器拿走：「再看眼睛會瞎掉。」", "flag": null}, {"age": 7, "text": "你把青菜推到碗邊。媽媽說：「不吃青菜以後長不高，以後沒人想跟你玩。」", "flag": null}, {"age": 8, "text": "你上學遲到了。老師在門口說：「再遲到就不用來了，以後沒學校收你。」", "flag": null}, {"age": 9, "text": "你和同學吵架後打了一架。回家後爸爸說：「再打人就送你去少年隊，以後沒人管你。」", "flag": null}, {"age": 10, "text": "你考完試回家。媽媽問分數，你說還沒公布。她說：「考不好以後只能去當粗工，沒人看得起你。」", "flag": null}, {"age": 11, "text": "你想玩手機。爸爸說：「玩手機的小孩以後都沒出息，眼睛也會壞掉。」", "flag": null}, {"age": 5, "text": "你說晚上要開燈睡覺。媽媽說：「不關燈的話，鬼會來找你。」", "flag": null}, {"age": 12, "text": "你說要去同學家玩。爸爸說：「不要跟那種人混在一起，以後會學壞。」", "flag": null}, {"age": 8, "text": "你在商店指著一個玩具。媽媽說：「買了就不會再買別的，以後沒錢給你花。」", "flag": null}, {"age": 9, "text": "你體育課跑得很慢。老師說：「跑不快的人以後什麼都做不好。」", "flag": null}, {"age": 13, "text": "段考成績出來，你沒有達到家裡期待的分數。媽媽看著成績單說：「再這樣下去，以後只能去讀私立，沒人看得起。」", "flag": null}, {"age": 14, "text": "你說想休息一天不要去補習。爸爸說：「別人都在補，你不補以後就跟不上，沒有好學校讀。」", "flag": "heard_everyone"}, {"age": 15, "text": "你想加入某個社團。導師說：「現在不是玩的時候，社團會影響功課，以後考不上好大學。」", "flag": null}, {"age": 16, "text": "你晚上滑手機。媽媽進房說：「再玩手機眼睛會瞎，以後沒人要。」", "flag": null}, {"age": 17, "text": "模擬考成績不理想。親戚說：「考不好就去當兵，以後沒出息。」", "flag": null}, {"age": 18, "text": "你想選一個自己有興趣的科系。爸爸說：「讀那個以後沒工作，還是選熱門的比較保險。」", "flag": null}, {"age": 19, "text": "你說想打工賺零用錢。媽媽說：「現在打工會影響課業，以後沒好工作。」", "flag": null}, {"age": 20, "text": "你提到新認識的朋友。爸爸說：「不要跟那種人混，以後會學壞，沒有好下場。」", "flag": null}, {"age": 14, "text": "你週末想晚起。媽媽說：「早起的人才會成功，睡懶覺以後沒出息。」", "flag": null}, {"age": 16, "text": "你想穿比較輕鬆的衣服去學校。老師說：「穿成這樣以後沒人看得起你。」", "flag": null}, {"age": 18, "text": "你說想去看電影。爸爸說：「現在不是玩的時候，考完再玩，不然以後沒時間後悔。」", "flag": null}, {"age": 15, "text": "家庭聚餐時，長輩看著你說：「你看你表哥，成績多好。你要是再不用功，以後就沒人要。」", "flag": null}, {"age": 17, "text": "你提到班上有人在交往。媽媽說：「現在談戀愛會影響功課，以後考不上好學校。」", "flag": null}, {"age": 19, "text": "你想去某個公司實習。爸爸說：「那種地方沒前途，還是找大公司比較穩。」", "flag": null}, {"age": 21, "text": "你說想直接工作。親戚說：「不讀研究所以後沒競爭力，沒人會用你。」", "flag": null}, {"age": 13, "text": "你體育成績不好。老師說：「連跑步都跑不好，以後什麼都做不成。」", "flag": null}, {"age": 20, "text": "你想搬出去住。媽媽說：「現在搬出去會學壞，還是住家裡比較安全。」", "flag": null}, {"age": 22, "text": "你投了幾份履歷還沒回音。爸爸說：「再找不到工作就去當粗工，沒人會養你。」", "flag": null}, {"age": 14, "text": "月考排名出來，你不是前段。媽媽說：「再這樣下去，以後連私立都讀不上。」", "flag": null}, {"age": 15, "text": "你提到要跟同學出去。爸爸說：「不要跟成績差的人混，以後會被拖下水。」", "flag": null}, {"age": 16, "text": "你說昨晚讀到很晚。媽媽說：「睡不夠以後長不高，也考不好。」", "flag": null}, {"age": 17, "text": "你想填一個冷門科系。親戚說：「讀那個以後沒工作，沒人會錄你。」", "flag": null}, {"age": 18, "text": "你想增加打工時數。爸爸說：「打工太多會影響課業，以後沒好前途。」", "flag": null}, {"age": 19, "text": "你還想繼續參加社團。媽媽說：「大學了還在玩社團，以後沒競爭力。」", "flag": null}, {"age": 20, "text": "你想去小公司實習。爸爸說：「小公司沒名氣，以後履歷不好看。」", "flag": null}, {"age": 21, "text": "你說想先工作再決定要不要讀研究所。親戚說：「現在不讀以後就沒機會了。」", "flag": "heard_miss_chance"}, {"age": 13, "text": "你把制服外套脫掉。老師說：「再這樣穿以後沒人看得起你。」", "flag": null}, {"age": 22, "text": "你拿到一份工作offer。爸爸說：「薪水這麼低，以後怎麼生活。」", "flag": null}, {"age": 23, "text": "你拿到第一份正職。親戚說：「年輕人要多磨練，薪水低一點沒關係，以後會好。」", "flag": null}, {"age": 24, "text": "你連續加班一週。主管說：「公司像家，大家一起拼，以後升遷才有機會。」", "flag": null}, {"age": 25, "text": "你想請一天假處理私事。主管說：「現在請假會影響團隊，年輕人要學會犧牲。」", "flag": null}, {"age": 26, "text": "你想談加薪。主管說：「現在公司辛苦，等業績好了自然會調，要有耐心。」", "flag": null}, {"age": 27, "text": "你收到其他公司的面試邀請。同事說：「現在跳槽風險很大，還是待著比較穩。」", "flag": null}, {"age": 28, "text": "家人問你什麼時候結婚。長輩說：「再拖下去就沒人要了，以後更難。」", "flag": null}, {"age": 29, "text": "你說現在買不起房。親戚說：「年輕人不買房以後永遠買不起，要趕緊。」", "flag": null}, {"age": 30, "text":  "result": "聊完後各自離開，沒有後續要求。"}, {"t": "說最近忙", "eff": "心+1", "result": "他沒有再約。"}]}, {"id": "a_boundary_respected", "age": 38, "text": "你說下班後不看訊息。主管之後真的比較少在晚上找你。 > 你發現界線被尊重。", "choices": [{"t": "維持這個習慣", "eff": "心+2 警+1", "result": "你晚上可以休息，隔天工作也沒被針對。"}, {"t": "偶爾還是回", "eff": "心+1", "result": "你自己選擇回，但沒有被要求必須回。"}]}, {"id": "c_park_friend", "age": 8, "text": "公園裡有個不認識的小孩主動約你一起玩溜滑梯。他沒有搶你的位置。", "choices": [{"t": "一起玩", "eff": "心+2 人+1", "result": "你們玩了一陣子，他媽媽叫他時他跟你說再見。"}, {"t": "自己玩", "eff": "心+1", "result": "他沒有再來找你。"}]}, {"id": "c_teacher_sticker", "age": 10, "text": "你今天表現普通，老師還是給了你一張小貼紙，說：「有進步。」", "choices": [{"t": "收下", "eff": "心+2", "result": "你把貼紙貼在鉛筆盒上。"}, {"t": "說不用", "eff": "心+0", "result": "老師沒有再給。"}]}, {"id": "s_study_group_fair", "age": 16, "text": "讀書會大家輪流講題，沒有人一直讓你講最難的。", "choices": [{"t": "參與輪流", "eff": "心+2 人+1", "result": "結束時大家說下次再約。"}, {"t": "只聽", "eff": "心+1", "result": "沒有人強迫你講。"}]}, {"id": "s_professor_office_hour", "age": 20, "text": "你去教授的 office hour。他沒有趕你，聽你問完問題再回答。", "choices": [{"t": "問清楚", "eff": "心+2 警+1", "result": "你離開時比較懂了。"}, {"t": "很快離開", "eff": "心+1", "result": "教授沒有再留你。"}]}, {"id": "a_clear_kpi", "age": 26, "text": "年初主管把你的 KPI 寫清楚，沒有年底才說你沒達標。", "choices": [{"t": "確認內容", "eff": "警+2 心+1", "result": "你知道今年要做什麼。"}, {"t": "沒仔細看", "eff": "心+0", "result": "後來還是照著做。"}]}, {"id": "a_team_credit", "age": 29, "text": "專案成功後，主管在會議上提到大家的貢獻，沒有只講自己。", "choices": [{"t": "覺得被看見", "eff": "心+2 人+1", "result": "會後沒有人特別爭功。"}, {"t": "沒特別感覺", "eff": "心+1", "result": "會議結束。"}]}, {"id": "a_partner_no_blame", "age": 33, "text": "家裡有事情沒做好。伴侶沒有責怪你，只是一起處理。", "choices": [{"t": "一起處理", "eff": "心+2 人+1", "result": "事情解決後沒有人再提。"}, {"t": "說抱歉", "eff": "心+1", "result": "對方說沒關係。"}]}, {"id": "a_child_choice", "age": 37, "text": "孩子想自己決定週末要做什麼。你讓他選，沒有全盤安排。", "choices": [{"t": "讓他選", "eff": "心+1 人+1", "result": "你們照他的想法過了一天。"}, {"t": "還是你決定", "eff": "心+0", "result": "孩子沒有再堅持。"}]}, {"id": "a_no_after_hours", "age": 40, "text": "你明確說晚上不處理非緊急訊息。之後真的比較少人晚上找你。", "choices": [{"t": "維持界線", "eff": "心+2 警+1", "result": "你晚上可以休息。"}, {"t": "偶爾還是回", "eff": "心+1", "result": "你自己選擇。"}]}]};
const STAGE_MIN = {childhood:6, student:7};
const ENDINGS = [{"id": "END_TRUST_LONG", "name": "他每天跟我說早安", "base": 8, "boost": {"heard_stranger": 18}, "text": "你記得小時候大人說過，不要隨便跟陌生人說話。但這個人已經跟你聊天三個月了。", "card": "假交友結合投資。"}, {"id": "END_AUTHORITY_CALL", "name": "他說他是警察", "base": 6, "boost": {"heard_police": 16}, "text": "你小時候聽過「不去的話警察會來抓你」。這通電話裡，對方語氣很確定。", "card": "假檢警。真正警察不會電話要求操作 ATM。"}, {"id": "END_GROUP_PROFIT", "name": "群組裡每個人都在賺", "base": 10, "boost": {"heard_everyone": 20, "heard_miss_chance": 20}, "text": "你記得「別人都在做」。這次群組裡每個人都在曬獲利。", "card": "假投資群組曬單。"}, {"id": "END_DONT_WORRY", "name": "不想讓家人擔心", "base": 8, "boost": {"said_its_fine": 18}, "text": "你習慣跟家人說「還好」。這次你也沒有講。", "card": "不告知家人，損失擴大。"}, {"id": "END_INVEST_SMALL", "name": "先小額試試", "base": 10, "boost": {"heard_miss_chance": 18}, "text": "對方說先放一點點就好。你覺得金額不大，就轉了。", "card": "小額可出金再誘導加碼。"}, {"id": "END_SHOPPING_LINK", "name": "客服說要驗證", "base": 12, "boost": {"obey_authority": 16}, "text": "對方說要先驗證身分。你不想搞複雜，就照做了。", "card": "網購詐騙，出現「驗證」即高風險。"}, {"id": "END_ALMOST", "name": "差點匯出去", "base": 6, "boost": {"reminded_family": 22}, "light": true, "text": "你已經打開網銀了。後來你打給家人，對方說先不要。", "card": "最後一步被勸阻。"}, {"id": "END_QUIET", "name": "這一生沒什麼大事", "base": 15, "light": true, "text": "你沒有遇過什麼大詐騙。每個月都過得去。", "card": "多數人日常是小謊。"}, {"id": "END_HELPED_OTHERS", "name": "你勸過別人", "base": 4, "boost": {"reminded_family": 12}, "light": true, "text": "有朋友差點匯款，你叫他先打給家人。他後來沒有轉。", "card": "親友勸阻有效。"}];

let state = {age:4, stats:{存款:0,警覺:3,人際:3,心理:5}, flags:new Set(), log:[], stageCounts:{childhood:0,student:0}, used:new Set()};

function getStage(age){ return age<=12?'childhood':age<=22?'student':'adult'; }

function renderStart(){
  document.getElementById('app').innerHTML = `
    <div class="meta">台灣人生模擬 · 完整整合版 · 所有內容已載入</div>
    <h1>2300萬<span style="font-size:.48em;color:var(--mut)">分之</span><span class="one">1</span></h1>
    <p class="sub">你是其中一個。<br>大多數謊言很小，但有些會變成轉機。</p>
    <div class="card">
      <div class="stats">
        <div class="stat"><span>存款</span><b>隨機</b></div>
        <div class="stat"><span>警覺</span><b>隨機</b></div>
        <div class="stat"><span>人際</span><b>隨機</b></div>
        <div class="stat"><span>心理</span><b>隨機</b></div>
      </div>
      <p style="font-size:13px;color:var(--mut);margin:8px 0">已載入 ${CONTENT.lies.length} 則被動謊言、${CONTENT.pos.length} 則正面事件。</p>
      <button class="primary" onclick="startLife()">開始這一生 →</button>
    </div>
    <p class="footer">上當的人不笨，往往只是太真誠。</p>
  `;
}

function startLife(){
  state.stats.存款 = 10000 + Math.floor(Math.random()*80000);
  state.stats.警覺 = 2 + Math.floor(Math.random()*6);
  state.stats.人際 = 2 + Math.floor(Math.random()*6);
  state.stats.心理 = 3 + Math.floor(Math.random()*6);
  next();
}

function next(){
  if(state.age > 42) return showEnding();
  const stage = getStage(state.age);
  const min = STAGE_MIN[stage] || 0;
  const count = state.stageCounts[stage] || 0;

  // Prefer staying in stage if under min
  let candidates = [];
  if(stage !== 'adult' && count < min){
    candidates = CONTENT.lies.filter(l => l.age === state.age && !state.used.has('L'+l.age+l.text.slice(0,10)))
      .concat(CONTENT.pos.filter(p => p.age === state.age && !state.used.has(p.id)));
  }
  if(!candidates.length){
    candidates = CONTENT.lies.filter(l => Math.abs(l.age - state.age)<=1 && !state.used.has('L'+l.age+l.text.slice(0,10)))
      .concat(CONTENT.pos.filter(p => Math.abs(p.age - state.age)<=1 && !state.used.has(p.id)));
  }
  if(!candidates.length){ state.age++; return next(); }

  const item = candidates[Math.floor(Math.random()*candidates.length)];
  if(item.choices){
    // positive
    state.used.add(item.id);
    state.stageCounts[stage] = (state.stageCounts[stage]||0)+1;
    showPos(item);
  } else {
    // lie
    const key = 'L'+item.age+item.text.slice(0,10);
    state.used.add(key);
    if(item.flag) state.flags.add(item.flag);
    state.stats.心理 = Math.max(0, state.stats.心理-1);
    state.stageCounts[stage] = (state.stageCounts[stage]||0)+1;
    state.log.push(`[${item.age}歲] ${item.text.slice(0,40)}…`);
    document.getElementById('app').innerHTML = hud() + `
      <div class="card narr">${item.text}<br><small style="color:var(--mut)">（心 -1）${item.flag?' <span class="flag">'+item.flag+'</span>':''}</small></div>
      <button class="primary" onclick="advance()">繼續</button>` + logBox();
  }
}

function showPos(item){
  window._cur = item;
  document.getElementById('app').innerHTML = hud() + `
    <div class="card">
      <div class="narr">${item.text}</div>
      ${item.choices.map((c,i)=>`<div class="choice" onclick="pick(${i})">${c.t}</div>`).join('')}
    </div>` + logBox();
}

function pick(i){
  const c = window._cur.choices[i];
  const m = c.eff.match(/心([+-]\d+)/); if(m) state.stats.心理 += parseInt(m[1]);
  const a = c.eff.match(/警([+-]\d+)/); if(a) state.stats.警覺 += parseInt(a[1]);
  const p = c.eff.match(/人([+-]\d+)/); if(p) state.stats.人際 += parseInt(p[1]);
  if(c.t.includes('家人') || c.t.includes('打給')) state.flags.add('reminded_family');
  state.log.push(`[${state.age}歲] ${window._cur.text.slice(0,20)}… → ${c.t}`);
  document.getElementById('app').innerHTML = hud() + `
    <div class="card narr">${c.result}</div>
    <button class="primary" onclick="advance()">繼續</button>` + logBox();
}

function advance(){ state.age++; next(); }

function hud(){
  const st = getStage(state.age);
  return `<div class="meta">${state.age}歲 · ${st} · 心${state.stats.心理} 警${state.stats.警覺} 人${state.stats.人際} · 階段事件 ${state.stageCounts[st]||0}</div>`;
}
function logBox(){ return `<div class="log">${state.log.slice(-8).join('<br>')}</div>`; }

function showEnding(){
  const pool = ENDINGS.map(e=>{
    let w = e.base;
    for(const [f,nw] of Object.entries(e.boost||{})) if(state.flags.has(f)) w = Math.max(w,nw);
    if(e.id==='END_QUIET' && state.flags.size===0) w=25;
    return {e,w};
  });
  const light = pool.filter(x=>x.e.light);
  const heavy = pool.filter(x=>!x.e.light);
  const use = (state.flags.has('reminded_family') && Math.random()<0.55) ? light : (Math.random()<0.3?light:heavy);
  let total = use.reduce((s,x)=>s+x.w,0) || 1;
  let r = Math.random()*total;
  let chosen = use[0].e;
  for(const x of use){ if((r-=x.w)<=0){ chosen=x.e; break; } }
  document.getElementById('app').innerHTML = `
    <div class="meta">結局</div>
    <h1 style="font-size:30px">${chosen.name}</h1>
    <div class="card end">
      <div class="narr">${chosen.text}</div>
      <p style="margin-top:10px"><b>案件卡：</b>${chosen.card}</p>
      <p><b>本局旗標：</b>${[...state.flags].join('、')||'無'}</p>
      <p style="font-size:13px;color:var(--mut)">童年事件 ${state.stageCounts.childhood||0} · 學生 ${state.stageCounts.student||0}</p>
    </div>
    <button class="primary" onclick="location.reload()">再活一次</button>
    <div class="log">${state.log.join('<br>')}</div>
  `;
}
renderStart();
</script>

</html>
